services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: agent-testlab-jenkins
    restart: unless-stopped
    ports:
      # The current macOS setup uses native Jenkins on 8080.
      - "8081:8080"
    volumes:
      - jenkins-data:/var/jenkins_home

# Keep Jenkins separate: starting TestLab must not implicitly start a CI server.

volumes:
  jenkins-data:
