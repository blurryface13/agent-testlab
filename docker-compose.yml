services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TESTLAB_DATA_ROOT: /app/data/testlab
      REDIS_URL: redis://redis:6379/0
      # Docker Desktop reaches an Asteria service on the host through this name.
      # Override with an intranet address when Asteria runs elsewhere.
      ASTERIA_BASE_URL: ${ASTERIA_BASE_URL:-http://host.docker.internal:8018}
      # 若部署机能访问真实 T2I pipeline，可在 .env 设置并按部署文档挂载。
      T2I_PIPELINE_ROOT: ${T2I_PIPELINE_ROOT:-/app/demo}
    volumes:
      - testlab-data:/app/data/testlab
    ports:
      - "8010:8010"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/testing/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "4173:4173"
    depends_on:
      api:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  testlab-data:
  redis-data:
